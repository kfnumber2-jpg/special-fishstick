<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <radialGradient id="glow" cx="68%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#caff4d" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#caff4d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#caff4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#5a8bff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5a8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#caff4d" stop-opacity="0"/>
      <stop offset="70%" stop-color="#caff4d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#eaffb0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#0a0a0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0b"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- Diagonal speed streaks -->
  <g transform="rotate(-18 800 450)" stroke-linecap="round">
    <rect x="120" y="180" width="780" height="6" rx="3" fill="url(#streak)" opacity="0.9"/>
    <rect x="420" y="250" width="980" height="4" rx="2" fill="url(#streak)" opacity="0.6"/>
    <rect x="250" y="340" width="640" height="3" rx="1.5" fill="url(#streak)" opacity="0.45"/>
    <rect x="560" y="430" width="1120" height="7" rx="3.5" fill="url(#streak)" opacity="0.8"/>
    <rect x="180" y="520" width="520" height="3" rx="1.5" fill="url(#streak)" opacity="0.4"/>
    <rect x="640" y="610" width="900" height="5" rx="2.5" fill="url(#streak)" opacity="0.65"/>
    <rect x="320" y="700" width="700" height="3" rx="1.5" fill="url(#streak)" opacity="0.35"/>
  </g>

  <!-- Particle field -->
  <g fill="#caff4d">
    <circle cx="1180" cy="210" r="3.5" opacity="0.9"/>
    <circle cx="1320" cy="300" r="2" opacity="0.6"/>
    <circle cx="1060" cy="360" r="2.5" opacity="0.7"/>
    <circle cx="1400" cy="180" r="2" opacity="0.5"/>
    <circle cx="980" cy="250" r="2" opacity="0.55"/>
    <circle cx="1250" cy="430" r="3" opacity="0.5"/>
    <circle cx="1140" cy="120" r="2" opacity="0.45"/>
    <circle cx="900" cy="420" r="2" opacity="0.4"/>
  </g>
  <g fill="#9bd0ff">
    <circle cx="300" cy="640" r="2.5" opacity="0.5"/>
    <circle cx="200" cy="560" r="2" opacity="0.4"/>
    <circle cx="420" cy="700" r="3" opacity="0.45"/>
  </g>

  <!-- Bottom fade so headline text stays readable -->
  <rect width="1600" height="900" fill="url(#fade)"/>
</svg>
